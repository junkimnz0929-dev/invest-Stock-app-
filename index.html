<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="주식분석" />
  <title>주식 AI 분석기</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0a0a0a; --bg2:#141414; --bg3:#1d1d1d; --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.16); --text:#f2f2f2; --text2:#a0a0a0; --text3:#666; --up:#f04e2f; --down:#4a9eff; --green:#1db874; --yellow:#f5a623; --radius:14px; --radius-sm:9px; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; -webkit-font-smoothing:antialiased; }
    .header { position:sticky; top:0; z-index:100; background:rgba(10,10,10,.94); backdrop-filter:blur(12px); border-bottom:.5px solid var(--border); padding:14px 16px 12px; }
    .header-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .app-icon { width:32px; height:32px; background:var(--up); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; }
    .app-title { font-size:17px; font-weight:700; letter-spacing:-.3px; }
    .app-subtitle { font-size:11px; color:var(--text3); margin-left:auto; }
    .search-wrap { display:flex; gap:8px; }
    .search-input { flex:1; background:var(--bg3); border:.5px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-size:15px; padding:10px 13px; outline:none; }
    .search-input:focus { border-color:var(--border2); }
    .search-btn, .small-btn { background:var(--up); border:0; color:white; border-radius:var(--radius-sm); padding:10px 15px; font-weight:600; cursor:pointer; }
    .small-btn { padding:8px 10px; font-size:12px; background:var(--bg3); border:.5px solid var(--border2); }
    .chips-wrap { padding:10px 16px; display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; }
    .chips-wrap::-webkit-scrollbar { display:none; }
    .chip { flex-shrink:0; font-size:12px; padding:6px 12px; border-radius:20px; border:.5px solid var(--border2); color:var(--text2); background:var(--bg2); cursor:pointer; }
    .main { padding:0 16px 32px; }
    .empty, .loading { text-align:center; padding:70px 20px 40px; color:var(--text3); line-height:1.7; }
    .empty i { font-size:48px; display:block; margin-bottom:14px; }
    .spinner { display:inline-block; width:22px; height:22px; border:2px solid var(--border2); border-top-color:var(--up); border-radius:50%; animation:spin .75s linear infinite; margin-bottom:14px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .panel, .price-card, .metric-card, .ai-card, .score-card, .bar-section { background:var(--bg2); border:.5px solid var(--border); border-radius:var(--radius); }
    .panel { padding:14px; margin:12px 0 16px; }
    .api-grid { display:grid; grid-template-columns:1fr; gap:8px; margin-top:10px; }
    .api-input { width:100%; background:var(--bg3); border:.5px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:10px; font-size:13px; outline:none; }
    .panel-title { font-size:13px; font-weight:700; margin-bottom:4px; }
    .panel-text, .note, .disclaimer { font-size:11px; color:var(--text3); line-height:1.65; }
    .error { background:rgba(240,78,47,.08); border:.5px solid rgba(240,78,47,.28); border-radius:var(--radius); padding:16px; margin-top:16px; color:var(--up); font-size:13px; line-height:1.7; }
    .section-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text3); margin:20px 0 10px; }
    .price-card { padding:16px; margin-top:16px; }
    .company-meta { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:12px; }
    .company-sector { font-size:11px; color:var(--text3); margin-bottom:3px; }
    .company-name { font-size:20px; font-weight:700; letter-spacing:-.4px; }
    .market-cap-label { font-size:10px; color:var(--text3); text-align:right; }
    .market-cap-val { font-size:14px; font-weight:600; text-align:right; margin-top:2px; white-space:nowrap; }
    .price-row { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
    .price-current { font-size:31px; font-weight:800; letter-spacing:-.7px; }
    .price-change { font-size:14px; font-weight:700; }
    .up { color:var(--up); } .down { color:var(--down); } .green { color:var(--green); }
    .range-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--text3); margin-bottom:5px; }
    .range-bar { position:relative; height:5px; background:var(--bg3); border-radius:3px; }
    .range-fill { position:absolute; height:100%; background:var(--border2); border-radius:3px; }
    .range-dot { position:absolute; top:50%; transform:translate(-50%,-50%); width:11px; height:11px; border-radius:50%; background:var(--up); border:2px solid var(--bg2); }
    .data-source { font-size:10px; color:var(--text3); margin-top:8px; text-align:right; }
    .metrics-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .metric-card { padding:12px 10px 10px; border-radius:var(--radius-sm); }
    .metric-label { font-size:10px; color:var(--text3); margin-bottom:5px; }
    .metric-val { font-size:17px; font-weight:750; letter-spacing:-.2px; }
    .metric-sub { font-size:10px; color:var(--text3); margin-top:4px; line-height:1.35; }
    .bar-section { padding:14px 14px 10px; }
    .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
    .bar-year { font-size:11px; color:var(--text2); width:54px; flex-shrink:0; }
    .bar-track { flex:1; height:8px; background:var(--bg3); border-radius:4px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:4px; }
    .bar-val { font-size:11px; color:var(--text2); width:76px; text-align:right; flex-shrink:0; }
    .ai-card, .score-card { padding:16px; }
    .ai-section-head { display:flex; align-items:center; gap:7px; margin-bottom:7px; }
    .ai-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .ai-section-title { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.05em; }
    .ai-text { font-size:13px; line-height:1.75; color:var(--text); }
    .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:.5px solid var(--border); }
    .tag { font-size:11px; padding:4px 10px; border-radius:6px; background:var(--bg3); color:var(--text3); border:.5px solid var(--border); }
    .score-row { margin-bottom:12px; }
    .score-head { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; }
    .score-name { color:var(--text2); }
    .score-track { height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; }
    .score-fill { height:100%; border-radius:3px; }
    .disclaimer { margin-top:24px; padding:12px; background:var(--bg2); border-radius:var(--radius-sm); border:.5px solid var(--border); }
    .hidden { display:none; }
  </style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <div class="app-icon"><i class="ti ti-chart-candle"></i></div>
    <span class="app-title">주식 AI 분석기</span>
    <span class="app-subtitle">KR · US · API</span>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="tickerInput" type="text" placeholder="종목코드/티커 입력 (예: 005930, AAPL)" maxlength="20" autocomplete="off" />
    <button class="search-btn" onclick="analyzeStock()"><i class="ti ti-search"></i> 분석</button>
  </div>
</header>

<div class="chips-wrap">
  <span class="chip" onclick="setTicker('005930')">삼성전자</span>
  <span class="chip" onclick="setTicker('000660')">SK하이닉스</span>
  <span class="chip" onclick="setTicker('035420')">NAVER</span>
  <span class="chip" onclick="setTicker('005380')">현대차</span>
  <span class="chip" onclick="setTicker('051910')">LG화학</span>
  <span class="chip" onclick="setTicker('207940')">삼성바이오</span>
  <span class="chip" onclick="setTicker('AAPL')">Apple</span>
  <span class="chip" onclick="setTicker('MSFT')">Microsoft</span>
</div>

<main class="main">
  <div class="panel" id="apiPanel">
    <div class="panel-title"><i class="ti ti-key"></i> 무료 API 키 설정</div>
    <div class="panel-text">PER/PBR/배당/기업개요를 보려면 API 키가 필요합니다. 입력한 키는 이 기기 브라우저에만 저장됩니다.</div>
    <div class="api-grid">
      <input class="api-input" id="finnhubKey" placeholder="Finnhub API Key — 추천" />
      <input class="api-input" id="alphaKey" placeholder="Alpha Vantage API Key — 선택" />
      <div style="display:flex;gap:8px;">
        <button class="small-btn" onclick="saveKeys()">저장</button>
        <button class="small-btn" onclick="clearKeys()">삭제</button>
      </div>
    </div>
  </div>
  <div id="result">
    <div class="empty">
      <i class="ti ti-telescope"></i>
      <p>종목코드를 입력하면<br>시세와 핵심 지표를 분석합니다</p>
    </div>
  </div>
</main>

<script>
const KR_STOCKS = {
  '005930': { name:'삼성전자', sector:'Technology', industry:'Consumer Electronics / Semiconductors', market:'KOSPI', summary:'삼성전자는 메모리 반도체, 스마트폰, 디스플레이, 가전 등을 영위하는 대한민국 대표 종합 전자기업입니다. 반도체 업황, 환율, 글로벌 IT 수요, AI 서버 투자 흐름의 영향을 크게 받습니다.' },
  '000660': { name:'SK하이닉스', sector:'Technology', industry:'Semiconductors', market:'KOSPI', summary:'SK하이닉스는 DRAM과 NAND Flash를 중심으로 하는 글로벌 메모리 반도체 기업입니다. AI 서버와 HBM 수요, 메모리 가격 사이클, 설비투자 규모가 핵심 변수입니다.' },
  '035420': { name:'NAVER', sector:'Communication Services', industry:'Internet Content & Information', market:'KOSPI', summary:'NAVER는 검색, 광고, 커머스, 핀테크, 콘텐츠, 클라우드 사업을 운영하는 인터넷 플랫폼 기업입니다. 광고 경기, 커머스 성장률, AI 서비스 경쟁력이 주요 관전 포인트입니다.' },
  '005380': { name:'현대차', sector:'Consumer Cyclical', industry:'Auto Manufacturers', market:'KOSPI', summary:'현대차는 승용차, SUV, 전기차, 수소차 등을 생산·판매하는 글로벌 완성차 기업입니다. 환율, 판매 믹스, 전기차 전환, 미국·유럽 시장 판매가 실적에 중요합니다.' },
  '051910': { name:'LG화학', sector:'Basic Materials', industry:'Chemicals', market:'KOSPI', summary:'LG화학은 석유화학, 첨단소재, 생명과학 사업을 영위하는 기업입니다. 배터리 소재, 화학제품 스프레드, 자회사 가치가 투자 판단의 주요 요소입니다.' },
  '207940': { name:'삼성바이오로직스', sector:'Healthcare', industry:'Biotechnology', market:'KOSPI', summary:'삼성바이오로직스는 바이오의약품 위탁개발생산(CDMO)을 주력으로 하는 기업입니다. 글로벌 제약사 수주, 공장 가동률, 생산능력 확대가 핵심 성장 변수입니다.' },
  '006400': { name:'삼성SDI', sector:'Industrials', industry:'Electrical Equipment', market:'KOSPI', summary:'삼성SDI는 소형전지, 전기차 배터리, ESS, 전자재료 사업을 영위합니다. 전기차 수요, 배터리 수익성, 고객사 다변화가 주요 투자 포인트입니다.' }
};

let keyState = { finnhub: '', alpha: '' };
loadKeys();
document.getElementById('tickerInput').addEventListener('keydown', e => { if (e.key === 'Enter') analyzeStock(); });

function loadKeys() {
  keyState.finnhub = localStorage.getItem('FINNHUB_KEY') || '';
  keyState.alpha = localStorage.getItem('ALPHA_KEY') || '';
  setTimeout(() => {
    document.getElementById('finnhubKey').value = keyState.finnhub;
    document.getElementById('alphaKey').value = keyState.alpha;
  }, 0);
}
function saveKeys() {
  keyState.finnhub = document.getElementById('finnhubKey').value.trim();
  keyState.alpha = document.getElementById('alphaKey').value.trim();
  localStorage.setItem('FINNHUB_KEY', keyState.finnhub);
  localStorage.setItem('ALPHA_KEY', keyState.alpha);
  toast('API 키가 저장되었습니다.');
}
function clearKeys() {
  localStorage.removeItem('FINNHUB_KEY'); localStorage.removeItem('ALPHA_KEY');
  keyState = { finnhub:'', alpha:'' };
  document.getElementById('finnhubKey').value = ''; document.getElementById('alphaKey').value = '';
  toast('API 키가 삭제되었습니다.');
}
function toast(msg) { document.getElementById('result').innerHTML = `<div class="panel"><div class="panel-title">${msg}</div><div class="panel-text">이제 종목코드를 입력하고 분석 버튼을 눌러주세요.</div></div>`; }
function setTicker(code) { document.getElementById('tickerInput').value = code; analyzeStock(); }
function fmt(n) { if (n === null || n === undefined || n === '' || Number.isNaN(Number(n))) return 'N/A'; return Number(n).toLocaleString('ko-KR'); }
function fmtNum(n, d=1) { if (n === null || n === undefined || n === '' || Number.isNaN(Number(n))) return null; return Number(n).toFixed(d); }
function fmtBil(n) { if (!n || Number.isNaN(Number(n))) return 'N/A'; const abs = Math.abs(Number(n)); if (abs >= 1e12) return (n/1e12).toFixed(1)+'조'; if (abs >= 1e8) return (n/1e8).toFixed(1)+'억'; if (abs >= 1e4) return (n/1e4).toFixed(0)+'만'; return fmt(Math.round(n)); }
function isKrCode(input) { return /^\d{6}(\.KS|\.KQ)?$/i.test(input); }
function normalizeInput(input) { const raw = input.trim().toUpperCase(); if (/^\d{6}$/.test(raw)) return raw + '.KS'; return raw; }
function baseCode(symbol) { return symbol.replace(/\.KS|\.KQ/gi, ''); }
async function fetchJson(url) { const res = await fetch(url); if (!res.ok) throw new Error('API 요청 실패: ' + res.status); const json = await res.json(); if (json.error || json.Information || json.Note) throw new Error(json.error || json.Information || json.Note); return json; }

async function fetchFinnhub(symbol) {
  if (!keyState.finnhub) return null;
  const token = encodeURIComponent(keyState.finnhub);
  const trySymbols = isKrCode(symbol) ? [symbol, baseCode(symbol)+'.KQ'] : [symbol];
  let last = null;
  for (const s of trySymbols) {
    try {
      const enc = encodeURIComponent(s);
      const [quote, metric, profile] = await Promise.all([
        fetchJson(`https://finnhub.io/api/v1/quote?symbol=${enc}&token=${token}`),
        fetchJson(`https://finnhub.io/api/v1/stock/metric?symbol=${enc}&metric=all&token=${token}`),
        fetchJson(`https://finnhub.io/api/v1/stock/profile2?symbol=${enc}&token=${token}`)
      ]);
      if (quote && Number(quote.c) > 0) return { source:'Finnhub', symbol:s, quote, metric: metric.metric || {}, profile: profile || {} };
      last = { source:'Finnhub', symbol:s, quote, metric: metric.metric || {}, profile: profile || {} };
    } catch(e) { last = null; }
  }
  return last;
}

async function fetchAlpha(symbol) {
  if (!keyState.alpha) return null;
  const key = encodeURIComponent(keyState.alpha);
  const s = encodeURIComponent(symbol);
  try {
    const [quoteRaw, overview] = await Promise.all([
      fetchJson(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${s}&apikey=${key}`),
      fetchJson(`https://www.alphavantage.co/query?function=OVERVIEW&symbol=${s}&apikey=${key}`)
    ]);
    const q = quoteRaw['Global Quote'] || {};
    return { source:'Alpha Vantage', symbol, quote:q, overview: overview || {} };
  } catch(e) { return null; }
}

function mergeData(symbol, finnhub, alpha) {
  const code = baseCode(symbol);
  const fallback = KR_STOCKS[code] || {};
  const fq = finnhub?.quote || {};
  const fm = finnhub?.metric || {};
  const fp = finnhub?.profile || {};
  const aq = alpha?.quote || {};
  const ao = alpha?.overview || {};
  const current = num(fq.c) ?? num(aq['05. price']);
  const prev = num(fq.pc) ?? num(aq['08. previous close']);
  const change = num(fq.d) ?? (current != null && prev != null ? current - prev : null);
  const changePct = num(fq.dp) ?? num(String(aq['10. change percent'] || '').replace('%',''));
  return {
    symbol: finnhub?.symbol || alpha?.symbol || symbol,
    name: fp.name || ao.Name || fallback.name || symbol,
    sector: fp.finnhubIndustry || ao.Sector || fallback.sector || '-',
    industry: ao.Industry || fallback.industry || '',
    market: fallback.market || fp.exchange || ao.Exchange || '',
    currency: fp.currency || 'KRW',
    current, prev, change, changePct,
    high52: num(fm['52WeekHigh']) ?? num(ao['52WeekHigh']),
    low52: num(fm['52WeekLow']) ?? num(ao['52WeekLow']),
    marketCap: num(fp.marketCapitalization) ? num(fp.marketCapitalization) * 1e6 : num(ao.MarketCapitalization),
    per: num(fm.peNormalizedAnnual) ?? num(fm.peBasicExclExtraTTM) ?? num(ao.PERatio),
    pbr: num(fm.pbAnnual) ?? num(fm.ptbvAnnual) ?? num(ao.PriceToBookRatio),
    dividendYield: num(fm.dividendYieldIndicatedAnnual) ?? (num(ao.DividendYield) != null ? num(ao.DividendYield)*100 : null),
    eps: num(fm.epsNormalizedAnnual) ?? num(ao.EPS),
    roe: num(fm.roeTTM) ?? num(ao.ReturnOnEquityTTM) != null ? (num(fm.roeTTM) ?? num(ao.ReturnOnEquityTTM)*100) : null,
    margin: num(fm.operatingMarginTTM) ?? (num(ao.OperatingMarginTTM) != null ? num(ao.OperatingMarginTTM)*100 : null),
    revGrowth: num(fm.revenueGrowthTTMYoy) ?? (num(ao.QuarterlyRevenueGrowthYOY) != null ? num(ao.QuarterlyRevenueGrowthYOY)*100 : null),
    summary: ao.Description || fallback.summary || '기업 개요 데이터가 없습니다. API 제공 범위에 따라 일부 한국 종목의 설명은 제한될 수 있습니다.',
    website: fp.weburl || '',
    source: [finnhub?.source, alpha?.source].filter(Boolean).join(' + ') || 'Fallback'
  };
}
function num(v) { if (v === null || v === undefined || v === '' || v === 'None' || v === '-') return null; const n = Number(v); return Number.isFinite(n) ? n : null; }
function perComment(p) { if (p == null) return '데이터 없음'; if (p < 0) return '적자 또는 일회성 이익 영향'; if (p < 10) return '이익 대비 낮은 편'; if (p < 20) return '시장 평균권'; if (p < 40) return '성장 기대 반영'; return '고평가 주의'; }
function pbrComment(p) { if (p == null) return '데이터 없음'; if (p < 1) return '자산가치 대비 낮은 편'; if (p < 2) return '적정권'; if (p < 5) return '성장 기대 반영'; return '자산 대비 높은 평가'; }
function scoreClamp(x) { return Math.min(100, Math.max(0, Math.round(x))); }

async function analyzeStock() {
  const input = document.getElementById('tickerInput').value.trim();
  if (!input) return;
  const symbol = normalizeInput(input);
  document.getElementById('result').innerHTML = `<div class="loading"><div class="spinner"></div><div>API 데이터 불러오는 중...</div></div>`;
  try {
    if (!keyState.finnhub && !keyState.alpha) throw new Error('먼저 무료 API 키를 입력해주세요. Finnhub 키 하나만 있어도 대부분 작동합니다.');
    const [finnhub, alpha] = await Promise.all([fetchFinnhub(symbol), fetchAlpha(symbol)]);
    const data = mergeData(symbol, finnhub, alpha);
    if (!data.current) throw new Error('시세 데이터를 찾지 못했습니다. 한국 종목은 005930 또는 005930.KS 형식으로 입력해보세요.');
    render(data);
  } catch(err) {
    document.getElementById('result').innerHTML = `<div class="error"><strong>⚠ 데이터를 불러오지 못했습니다</strong><br><br>${err.message || '알 수 없는 오류'}<br><br><small>• API 키가 맞는지 확인해주세요<br>• 무료 API는 호출 제한이 있습니다<br>• 한국 종목은 005930, 000660처럼 6자리로 입력해보세요</small></div>`;
  }
}

function render(d) {
  const rangePos = (d.high52 && d.low52 && d.high52 > d.low52) ? Math.min(100, Math.max(0, Math.round((d.current - d.low52) / (d.high52 - d.low52) * 100))) : 50;
  const chgClass = (d.changePct ?? 0) >= 0 ? 'up' : 'down';
  const sign = (d.changePct ?? 0) >= 0 ? '+' : '';
  const valueScore = d.per ? scoreClamp(100 - Math.min(d.per * 1.2, 85)) : 50;
  const growthScore = d.revGrowth != null ? scoreClamp(50 + d.revGrowth * 2) : 50;
  const profitScore = d.roe != null ? scoreClamp(50 + d.roe * 1.5) : 50;
  const scoreRows = [
    ['수익성', profitScore, 'var(--green)'], ['성장성', growthScore, 'var(--down)'], ['가치평가', valueScore, 'var(--yellow)']
  ].map(([label,val,color]) => `<div class="score-row"><div class="score-head"><span class="score-name">${label}</span><span style="color:${color};font-weight:700">${val}</span></div><div class="score-track"><div class="score-fill" style="width:${val}%;background:${color}"></div></div></div>`).join('');
  const financialItems = [
    ['ROE', d.roe, '%'], ['영업이익률', d.margin, '%'], ['매출성장률', d.revGrowth, '%']
  ].filter(x => x[1] != null);
  const financialSection = financialItems.length ? `<p class="section-label">수익성 / 성장성</p><div class="bar-section">${financialItems.map(([label,val,unit]) => `<div class="bar-row"><span class="bar-year">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, Math.abs(val)*2)}%;background:${val>=0?'rgba(29,184,116,.35)':'rgba(240,78,47,.35)'}"></div></div><span class="bar-val ${val>=0?'green':'up'}">${val>=0?'+':''}${fmtNum(val,1)}${unit}</span></div>`).join('')}</div>` : '';

  document.getElementById('result').innerHTML = `
    <div class="price-card">
      <div class="company-meta"><div><div class="company-sector">${d.sector}${d.industry ? ' · '+d.industry : ''}</div><div class="company-name">${d.name}</div></div><div><div class="market-cap-label">시가총액</div><div class="market-cap-val">${fmtBil(d.marketCap)}</div></div></div>
      <div class="price-row"><span class="price-current">${fmt(d.current)}<small style="font-size:16px;font-weight:400;margin-left:3px;">${d.currency === 'KRW' ? '원' : d.currency}</small></span><span class="price-change ${chgClass}">${sign}${fmtNum(d.changePct,2) ?? '0.00'}%</span></div>
      <div class="range-labels"><span>52주 최저 ${fmt(d.low52)}</span><span>52주 최고 ${fmt(d.high52)}</span></div>
      <div class="range-bar"><div class="range-fill" style="width:${rangePos}%"></div><div class="range-dot" style="left:${rangePos}%"></div></div>
      <div class="data-source">데이터 · ${d.source} · ${d.symbol}</div>
    </div>
    <p class="section-label">밸류에이션</p>
    <div class="metrics-grid">
      <div class="metric-card"><div class="metric-label">PER</div><div class="metric-val">${d.per ? fmtNum(d.per,1)+'배' : 'N/A'}</div><div class="metric-sub">${perComment(d.per)}</div></div>
      <div class="metric-card"><div class="metric-label">PBR</div><div class="metric-val">${d.pbr ? fmtNum(d.pbr,2)+'배' : 'N/A'}</div><div class="metric-sub">${pbrComment(d.pbr)}</div></div>
      <div class="metric-card"><div class="metric-label">배당</div><div class="metric-val">${d.dividendYield != null ? fmtNum(d.dividendYield,2)+'%' : 'N/A'}</div><div class="metric-sub">배당수익률</div></div>
      <div class="metric-card"><div class="metric-label">EPS</div><div class="metric-val">${d.eps != null ? fmtNum(d.eps,0) : 'N/A'}</div><div class="metric-sub">주당순이익</div></div>
      <div class="metric-card"><div class="metric-label">ROE</div><div class="metric-val">${d.roe != null ? fmtNum(d.roe,1)+'%' : 'N/A'}</div><div class="metric-sub">자기자본이익률</div></div>
      <div class="metric-card"><div class="metric-label">영업이익률</div><div class="metric-val">${d.margin != null ? fmtNum(d.margin,1)+'%' : 'N/A'}</div><div class="metric-sub">수익성 지표</div></div>
    </div>
    ${financialSection}
    <p class="section-label">기업 정보</p>
    <div class="ai-card"><div class="ai-section"><div class="ai-section-head"><div class="ai-dot" style="background:#888"></div><span class="ai-section-title">기업 개요</span></div><p class="ai-text">${d.summary}</p></div><div class="tags"><span class="tag">${d.market || d.symbol}</span>${d.website ? `<span class="tag"><a href="${d.website}" target="_blank" style="color:inherit;text-decoration:none">공식 홈페이지</a></span>` : ''}</div></div>
    <p class="section-label">종합 점수</p>
    <div class="score-card">${scoreRows}<div class="note">점수는 API에서 받은 PER, ROE, 매출성장률 등 핵심 지표를 단순 환산한 참고용 지표입니다.</div></div>
    <p class="disclaimer">※ 이 앱은 투자 조언이 아니라 정보 확인용입니다. 무료 API의 제공 범위에 따라 일부 종목은 PER/PBR/배당/기업개요가 N/A로 표시될 수 있습니다. 정확한 투자 판단은 DART, KRX, 증권사 리포트와 함께 확인하세요.</p>
  `;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
