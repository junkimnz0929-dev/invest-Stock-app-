<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="주식분석" />
  <meta name="description" content="한국 주식 AI 분석기" />
  <title>주식 AI 분석기</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --bg2: #141414; --bg3: #1c1c1c;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text: #f0f0f0; --text2: #888; --text3: #555;
      --up: #f04e2f; --down: #4a9eff; --green: #1db874;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family: -apple-system, 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; -webkit-font-smoothing: antialiased; }

    .header { position: sticky; top: 0; z-index: 100; background: rgba(10,10,10,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 0.5px solid var(--border); padding: 14px 16px 12px; }
    .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .app-icon { width: 32px; height: 32px; background: var(--up); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; flex-shrink: 0; }
    .app-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
    .app-subtitle { font-size: 11px; color: var(--text3); margin-left: auto; }
    .search-wrap { display: flex; gap: 8px; }
    .search-input { flex: 1; background: var(--bg3); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; padding: 10px 14px; outline: none; -webkit-appearance: none; transition: border-color 0.15s; }
    .search-input:focus { border-color: var(--border2); }
    .search-input::placeholder { color: var(--text3); }
    .search-btn { background: var(--up); border: none; border-radius: var(--radius-sm); color: #fff; font-size: 14px; font-weight: 500; padding: 10px 18px; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
    .search-btn:active { opacity: 0.75; }

    .chips-wrap { padding: 10px 16px; display: flex; gap: 7px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .chips-wrap::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border2); color: var(--text2); background: var(--bg2); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: all 0.15s; }
    .chip:active { background: var(--bg3); color: var(--text); }

    .main { padding: 0 16px 32px; }
    .empty { text-align: center; padding: 80px 20px 40px; color: var(--text3); }
    .empty i { font-size: 48px; margin-bottom: 14px; display: block; }
    .empty p { font-size: 14px; line-height: 1.7; }
    .loading { text-align: center; padding: 80px 20px; color: var(--text2); font-size: 14px; }
    .spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--border2); border-top-color: var(--up); border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: rgba(240,78,47,0.08); border: 0.5px solid rgba(240,78,47,0.25); border-radius: var(--radius); padding: 16px; margin-top: 16px; color: var(--up); font-size: 13px; line-height: 1.7; }

    .section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin: 20px 0 10px; }
    .price-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
    .company-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .company-sector { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
    .company-name { font-size: 19px; font-weight: 600; letter-spacing: -0.3px; }
    .market-cap-label { font-size: 10px; color: var(--text3); text-align: right; }
    .market-cap-val { font-size: 14px; font-weight: 500; text-align: right; margin-top: 2px; }
    .price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .price-current { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    .price-change { font-size: 14px; font-weight: 600; }
    .up { color: var(--up); } .down { color: var(--down); }
    .range-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); margin-bottom: 5px; }
    .range-bar { position: relative; height: 5px; background: var(--bg3); border-radius: 3px; }
    .range-fill { position: absolute; height: 100%; background: var(--border2); border-radius: 3px; }
    .range-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 11px; height: 11px; border-radius: 50%; background: var(--up); border: 2px solid var(--bg2); }

    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .metric-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 12px 10px; }
    .metric-label { font-size: 10px; color: var(--text3); margin-bottom: 5px; }
    .metric-val { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .metric-sub { font-size: 10px; color: var(--text3); margin-top: 4px; line-height: 1.4; }

    .bar-section { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 14px 10px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .bar-year { font-size: 11px; color: var(--text2); width: 34px; flex-shrink: 0; }
    .bar-track { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .bar-val { font-size: 11px; color: var(--text2); width: 70px; text-align: right; flex-shrink: 0; }

    .ai-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .ai-section { margin-bottom: 14px; }
    .ai-section:last-of-type { margin-bottom: 0; }
    .ai-section-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
    .ai-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .ai-section-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; }
    .ai-text { font-size: 13px; line-height: 1.75; color: var(--text); }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 0.5px solid var(--border); }
    .tag { font-size: 11px; padding: 4px 10px; border-radius: 6px; background: var(--bg3); color: var(--text3); border: 0.5px solid var(--border); }

    .score-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .score-row { margin-bottom: 12px; }
    .score-row:last-child { margin-bottom: 0; }
    .score-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
    .score-name { color: var(--text2); }
    .score-track { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
    .score-fill { height: 100%; border-radius: 3px; }
    .note { font-size: 11px; color: var(--text3); line-height: 1.6; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }

    .data-source { font-size: 10px; color: var(--text3); margin-top: 8px; text-align: right; }
    .disclaimer { font-size: 10px; color: var(--text3); line-height: 1.6; margin-top: 24px; padding: 12px; background: var(--bg2); border-radius: var(--radius-sm); border: 0.5px solid var(--border); }

    .install-banner { display: none; position: fixed; bottom: 16px; left: 16px; right: 16px; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 14px 16px; z-index: 999; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .install-banner.show { display: flex; align-items: center; gap: 12px; }
    .install-text { flex: 1; font-size: 13px; color: var(--text); }
    .install-text small { display: block; font-size: 11px; color: var(--text2); margin-top: 2px; }
    .install-btn { background: var(--up); color: #fff; border: none; border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .install-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 20px; padding: 4px; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="app-icon"><i class="ti ti-chart-candle"></i></div>
    <span class="app-title">주식 AI 분석기</span>
    <span class="app-subtitle">KRX · KOSPI · KOSDAQ</span>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="tickerInput" type="text" inputmode="numeric" placeholder="종목코드 입력 (예: 005930)" maxlength="10" autocomplete="off" />
    <button class="search-btn" onclick="analyzeStock()"><i class="ti ti-search"></i> 분석</button>
  </div>
</header>

<div class="chips-wrap">
  <span class="chip" onclick="setTicker('005930')">삼성전자</span>
  <span class="chip" onclick="setTicker('000660')">SK하이닉스</span>
  <span class="chip" onclick="setTicker('035420')">NAVER</span>
  <span class="chip" onclick="setTicker('005380')">현대차</span>
  <span class="chip" onclick="setTicker('051910')">LG화학</span>
  <span class="chip" onclick="setTicker('207940')">삼성바이오</span>
  <span class="chip" onclick="setTicker('006400')">삼성SDI</span>
</div>

<main class="main" id="result">
  <div class="empty">
    <i class="ti ti-telescope"></i>
    <p>종목코드를 입력하면<br>실시간 데이터를 분석해드립니다</p>
  </div>
</main>

<div class="install-banner" id="installBanner">
  <div class="install-text">홈 화면에 추가하기<small>앱처럼 바로 실행할 수 있어요</small></div>
  <button class="install-btn" id="installBtn">설치</button>
  <button class="install-close" onclick="document.getElementById('installBanner').classList.remove('show')">×</button>
</div>

<script>
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
});
document.getElementById('tickerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.target.blur(); analyzeStock(); }
});
function setTicker(code) {
  document.getElementById('tickerInput').value = code;
  analyzeStock();
}

function fmt(n) { return Number(n).toLocaleString('ko-KR'); }
function fmtBil(n) {
  const abs = Math.abs(n);
  if (abs >= 1e12) return (n/1e12).toFixed(1) + '조';
  if (abs >= 1e8)  return (n/1e8).toFixed(1) + '억';
  if (abs >= 1e4)  return (n/1e4).toFixed(0) + '만';
  return fmt(Math.round(n));
}

// 입력값 정리: 005930, 005930.KS, 035720.KQ 모두 지원
function normalizeTicker(input) {
  const raw = String(input || '').trim().toUpperCase().replace(/\s+/g, '');
  const match = raw.match(/^(\d{6})(?:\.(KS|KQ))?$/);
  if (!match) {
    throw new Error('종목코드는 6자리 숫자로 입력해주세요. 예: 005930 또는 035720.KQ');
  }
  return { code: match[1], suffix: match[2] ? `.${match[2]}` : getSuffix(match[1]) };
}

// 코스피/코스닥 suffix 자동 판별
function getSuffix(code) {
  // 정확한 자동 판별은 별도 KRX 종목 DB가 필요합니다.
  // 자주 쓰는 코스닥 대표 종목은 우선 .KQ로 처리하고, 나머지는 .KS 기본값입니다.
  const kosdaqCodes = new Set([
    '035720', // 카카오
    '086520', // 에코프로
    '091990', // 셀트리온헬스케어/과거 대표 코드
    '112040', // 위메이드
    '145020', // 휴젤
    '196170', // 알테오젠
    '247540', // 에코프로비엠
    '263750', // 펄어비스
    '293490', // 카카오게임즈
    '058470', // 리노공업
    '041510', // 에스엠
    '035900', // JYP Ent.
    '068760', // 셀트리온제약
    '028300', // HLB
    '039030', // 이오테크닉스
    '066970', // 엘앤에프
    '096530', // 씨젠
    '067310', // 하나마이크론
    '403870'  // HPSP
  ]);
  return kosdaqCodes.has(code) ? '.KQ' : '.KS';
}

async function fetchYahoo(ticker) {
  const { code, suffix } = normalizeTicker(ticker);
  const symbol = code + suffix;
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1y`;
  const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy);
  if (!res.ok) throw new Error(`데이터 요청 실패: ${res.status}`);
  return { symbol, data: await res.json() };
}

async function fetchQuote(ticker) {
  const { code, suffix } = normalizeTicker(ticker);
  const symbol = code + suffix;
  const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${symbol}?modules=price,summaryDetail,defaultKeyStatistics,financialData,assetProfile`;
  const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy);
  if (!res.ok) throw new Error(`데이터 요청 실패: ${res.status}`);
  const data = await res.json();
  if (data.quoteSummary?.error) {
    throw new Error(data.quoteSummary.error.description || 'Yahoo Finance에서 데이터를 찾지 못했습니다.');
  }
  return data;
}

async function analyzeStock() {
  const ticker = document.getElementById('tickerInput').value.trim();
  if (!ticker) return;

  document.getElementById('result').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>실시간 데이터 불러오는 중...</div>
    </div>`;

  try {
    const { code, suffix } = normalizeTicker(ticker);
    const symbol = code + suffix;
    const [quoteData] = await Promise.all([fetchQuote(symbol)]);

    const result = quoteData.quoteSummary?.result?.[0];
    if (!result) throw new Error('종목을 찾을 수 없습니다. 코드를 확인해주세요.');

    const price   = result.price || {};
    const detail  = result.summaryDetail || {};
    const stats   = result.defaultKeyStatistics || {};
    const fin     = result.financialData || {};
    const profile = result.assetProfile || {};

    const cur       = price.regularMarketPrice?.raw ?? 0;
    const prevClose = price.regularMarketPreviousClose?.raw ?? cur;
    const chgPct    = price.regularMarketChangePercent?.raw ?? 0;
    const high52    = detail.fiftyTwoWeekHigh?.raw ?? cur;
    const low52     = detail.fiftyTwoWeekLow?.raw ?? cur;
    const mktCap    = price.marketCap?.raw ?? 0;
    const per       = detail.trailingPE?.raw ?? (stats.trailingEps?.raw ? (cur / stats.trailingEps.raw) : null);
    const pbr       = stats.priceToBook?.raw ?? null;
    const divYield  = detail.dividendYield?.raw ? (detail.dividendYield.raw * 100).toFixed(2) : '0';
    const name      = price.longName || price.shortName || symbol;
    const sector    = profile.sector || price.exchange || '-';
    const currency  = price.currency || 'KRW';

    const rangePos = high52 > low52 ? Math.min(100, Math.max(0, Math.round((cur - low52) / (high52 - low52) * 100))) : 50;
    const chgClass = chgPct >= 0 ? 'up' : 'down';
    const chgSign  = chgPct >= 0 ? '+' : '';

    // 재무 점수 계산 (데이터 기반)
    const debtToEq  = fin.debtToEquity?.raw ?? 100;
    const roe       = fin.returnOnEquity?.raw ? fin.returnOnEquity.raw * 100 : null;
    const revGrowth = fin.revenueGrowth?.raw ? fin.revenueGrowth.raw * 100 : null;
    const margin    = fin.operatingMargins?.raw ? fin.operatingMargins.raw * 100 : null;

    const healthScore = Math.min(100, Math.max(0, Math.round(100 - Math.min(debtToEq / 3, 60) + (roe ? Math.min(roe, 20) : 0))));
    const growthScore = revGrowth != null ? Math.min(100, Math.max(0, Math.round(50 + revGrowth * 2))) : 50;
    const valueScore  = per ? Math.min(100, Math.max(0, Math.round(100 - Math.min(per * 1.2, 80)))) : 50;

    // PER 해석
    function perComment(p) {
      if (!p) return '데이터 없음';
      if (p < 0)  return '적자 기업 (이익 없음)';
      if (p < 10) return `이익 대비 ${p.toFixed(1)}배 — 저평가 가능성`;
      if (p < 20) return `이익 대비 ${p.toFixed(1)}배 — 시장 평균 수준`;
      if (p < 40) return `이익 대비 ${p.toFixed(1)}배 — 성장주 프리미엄`;
      return `이익 대비 ${p.toFixed(1)}배 — 고평가 주의`;
    }
    function pbrComment(p) {
      if (!p) return '데이터 없음';
      if (p < 1)  return `자산가치 ${p.toFixed(2)}배 — 자산 대비 저평가`;
      if (p < 2)  return `자산가치 ${p.toFixed(2)}배 — 적정 수준`;
      if (p < 5)  return `자산가치 ${p.toFixed(2)}배 — 성장 기대 반영`;
      return `자산가치 ${p.toFixed(2)}배 — 고평가 구간`;
    }

    const scores = [
      { label: '재무 건전성', val: healthScore, color: '#1db874' },
      { label: '성장성',     val: growthScore, color: '#4a9eff' },
      { label: '가치평가',   val: valueScore,  color: '#f5a623' }
    ];

    const scoreRows = scores.map(s => `
      <div class="score-row">
        <div class="score-head"><span class="score-name">${s.label}</span><span style="color:${s.color};font-weight:600">${s.val}</span></div>
        <div class="score-track"><div class="score-fill" style="width:${s.val}%;background:${s.color}"></div></div>
      </div>`).join('');

    // 재무 데이터 (있으면 표시)
    const revenueRaw = fin.totalRevenue?.raw;
    const grossRaw   = fin.grossProfits?.raw;
    const opRaw      = fin.operatingCashflow?.raw;

    let financialSection = '';
    if (revenueRaw) {
      const items = [
        { label: '매출',     val: revenueRaw, color: '#4a9eff44' },
        { label: '매출총이익', val: grossRaw ?? 0, color: '#1db87444' },
        { label: '영업CF',   val: opRaw ?? 0, color: opRaw >= 0 ? '#1db87444' : '#f04e2f44' },
      ];
      const maxV = Math.max(...items.map(i => Math.abs(i.val)));
      financialSection = `
        <p class="section-label">재무 현황 (최근 연간)</p>
        <div class="bar-section">
          ${items.map(i => `
            <div class="bar-row">
              <span class="bar-year">${i.label}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${maxV>0?Math.round(Math.abs(i.val)/maxV*100):0}%;background:${i.color}"></div></div>
              <span class="bar-val" style="${i.val<0?'color:var(--up)':''}">${i.val<0?'-':''}${fmtBil(Math.abs(i.val))}</span>
            </div>`).join('')}
        </div>`;
    }

    // 기업 요약
    const desc = profile.longBusinessSummary
      ? profile.longBusinessSummary.slice(0, 200) + (profile.longBusinessSummary.length > 200 ? '...' : '')
      : '기업 정보를 불러올 수 없습니다.';
    const industry = profile.industry || '';
    const employees = profile.fullTimeEmployees ? `임직원 ${fmt(profile.fullTimeEmployees)}명` : '';
    const website = profile.website || '';

    document.getElementById('result').innerHTML = `
      <div class="price-card">
        <div class="company-meta">
          <div>
            <div class="company-sector">${sector}${industry ? ' · '+industry : ''}</div>
            <div class="company-name">${name}</div>
          </div>
          <div>
            <div class="market-cap-label">시가총액</div>
            <div class="market-cap-val">${fmtBil(mktCap)}</div>
          </div>
        </div>
        <div class="price-row">
          <span class="price-current">${fmt(cur)}<small style="font-size:16px;font-weight:400;margin-left:3px;">${currency === 'KRW' ? '원' : currency}</small></span>
          <span class="price-change ${chgClass}">${chgSign}${(chgPct*100).toFixed(2)}%</span>
        </div>
        <div class="range-labels"><span>52주 최저 ${fmt(low52)}</span><span>52주 최고 ${fmt(high52)}</span></div>
        <div class="range-bar">
          <div class="range-fill" style="width:${rangePos}%"></div>
          <div class="range-dot" style="left:${rangePos}%"></div>
        </div>
        <div class="data-source">실시간 데이터 · Yahoo Finance · ${symbol}</div>
      </div>

      <p class="section-label">밸류에이션</p>
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">PER</div>
          <div class="metric-val">${per ? per.toFixed(1)+'배' : 'N/A'}</div>
          <div class="metric-sub">${perComment(per)}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">PBR</div>
          <div class="metric-val">${pbr ? pbr.toFixed(2)+'배' : 'N/A'}</div>
          <div class="metric-sub">${pbrComment(pbr)}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">배당</div>
          <div class="metric-val">${divYield}%</div>
          <div class="metric-sub">배당수익률</div>
        </div>
        ${roe != null ? `<div class="metric-card">
          <div class="metric-label">ROE</div>
          <div class="metric-val">${roe.toFixed(1)}%</div>
          <div class="metric-sub">자기자본이익률</div>
        </div>` : ''}
        ${margin != null ? `<div class="metric-card">
          <div class="metric-label">영업이익률</div>
          <div class="metric-val">${margin.toFixed(1)}%</div>
          <div class="metric-sub">수익성 지표</div>
        </div>` : ''}
        ${revGrowth != null ? `<div class="metric-card">
          <div class="metric-label">매출성장률</div>
          <div class="metric-val ${revGrowth >= 0 ? 'up' : 'down'}">${revGrowth >= 0 ? '+' : ''}${revGrowth.toFixed(1)}%</div>
          <div class="metric-sub">전년 대비</div>
        </div>` : ''}
      </div>

      ${financialSection}

      <p class="section-label">기업 정보</p>
      <div class="ai-card">
        <div class="ai-section">
          <div class="ai-section-head"><div class="ai-dot" style="background:#888"></div><span class="ai-section-title">기업 개요</span></div>
          <p class="ai-text">${desc}</p>
        </div>
        ${employees || website ? `<div class="tags">
          ${employees ? `<span class="tag"><i class="ti ti-users" style="font-size:11px"></i> ${employees}</span>` : ''}
          ${website ? `<span class="tag"><a href="${website}" target="_blank" style="color:inherit;text-decoration:none"><i class="ti ti-external-link" style="font-size:11px"></i> 공식 홈페이지</a></span>` : ''}
          <span class="tag">${suffix === '.KS' ? 'KOSPI' : 'KOSDAQ'} ${code}</span>
        </div>` : ''}
      </div>

      <p class="section-label">종합 점수</p>
      <div class="score-card">
        ${scoreRows}
        <div class="note"><i class="ti ti-info-circle" style="font-size:13px;vertical-align:-2px;"></i> 점수는 부채비율, ROE, 매출성장률, PER 등 실제 재무 데이터를 기반으로 자동 계산됩니다.</div>
      </div>

      <p class="disclaimer">※ Yahoo Finance 실시간 데이터 기반입니다. 투자 결정의 근거로 사용하지 마세요. 정확한 공시 데이터는 DART·KRX를 확인하세요.</p>
    `;

  } catch(err) {
    document.getElementById('result').innerHTML = `
      <div class="error">
        <strong>⚠ 데이터를 불러오지 못했습니다</strong><br><br>
        ${err.message || '알 수 없는 오류'}<br><br>
        <small>• 종목코드 6자리를 정확히 입력했는지 확인해주세요<br>
        • 코스닥 종목이 안 된다면 코드 뒤에 <b>.KQ</b>를 붙여 입력해보세요. 예: 035720.KQ<br>
        • 잠시 후 다시 시도해주세요</small>
      </div>`;
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
